name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['config.json', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk NagiHealth.apk
          gh release create "v${{ github.run_number }}" NagiHealth.apk --title "Версия 1.${{ github.run_number }}" --notes "${MSG:-Обновление}"
