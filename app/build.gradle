plugins { id 'com.android.application' }
android {
    namespace 'com.nagi.health'
    compileSdk 34
    defaultConfig {
        applicationId 'com.nagi.health'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName "1." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'nagihealth'
            keyAlias 'nagi'
            keyPassword 'nagihealth'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
        debug { signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
