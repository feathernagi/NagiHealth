<script>
// ===== Android-мост: заменяет облачные возможности на локальные =====
if(window.Android){
 const subs={};
 const mk=(path)=>({
  get:async()=>{const v=Android.get(path);return {data:()=>v?JSON.parse(v):null}},
  set:async(o)=>{Android.put(path,JSON.stringify(o))},
  onSnapshot:(cb)=>{(subs[path]=subs[path]||[]).push(cb);return()=>{}}
 });
 const db={doc:mk,collection:(c)=>({get:async()=>JSON.parse(Android.list(c)).map(d=>({id:d.id,data:()=>d.data})),doc:(k)=>mk(c+'/'+k)})};
 window.__cfgUpdate=()=>{const v=Android.get('config/main');(subs['config/main']||[]).forEach(cb=>cb({data:()=>v?JSON.parse(v):null}))};
 window.claude={use:async(n)=>n==='db'?db:null};
}
</script>

<script>
// ================= ПРОФИЛЬ И ЦЕЛИ (по умолчанию; Claude меняет через базу config/main) =================
let CFG={start:119,goal:90,kcal:2050,protein:150,water:2500,glass:250,
 msg:"Привет! Это наше с тобой приложение. Не нужно быть идеальным — нужно просто не пропускать два дня подряд. Сегодня сделай хотя бы одно: воду, 3-минутный перерыв или тренировку. Я рядом. — Claude",

// ================= КАРТИНКИ: детальные фигуры с плавной анимацией =================
// Суставы (вид сбоку, лицом вправо): hd голова, sh плечо, hp таз, kn колено, an лодыжка, to носок, el локоть, wr кисть; *2 — дальняя сторона
const BASE={hd:[60,14],sh:[60,29],hp:[60,61],kn:[61,85],an:[60,108],el:[60,45],wr:[61,59]};
const F=o=>Object.assign({},BASE,o);
const POSE={
 swing:[F({hd:[84,38],sh:[75,46],hp:[47,62],kn:[57,85],an:[60,108],el:[70,62],wr:[63,76],kb:1}),
        F({hd:[58,14],sh:[59,29],hp:[61,61],el:[74,32],wr:[89,33],kb:1,kbo:[6,4]})],
 goblet:[F({el:[67,45],wr:[69,35],el2:[66,45],wr2:[68,35],kb:1,kbo:[4,4]}),

        F({hd:[66,42],sh:[62,56],hp:[49,84],kn:[73,82],an:[63,108],el:[77,55],wr:[92,55],el2:[76,56],wr2:[91,56]})],
 row:[F({hd:[93,47],sh:[81,52],hp:[45,58],kn:[47,83],an:[45,108],kn2:[66,82],an2:[72,108],el:[81,68],wr:[81,84],el2:[90,66],wr2:[96,79],kb:1,chair:1}),

 push:[F({hd:[101,63],sh:[90,70],hp:[54,86],kn:[34,95],an:[15,103],to:[10,110],el:[90,89],wr:[91,108]}),
       F({hd:[99,91],sh:[88,96],hp:[52,101],kn:[33,104],an:[15,106],to:[10,110],el:[76,96],wr:[91,108]})],
 deskpush:[F({hd:[85,33],sh:[77,44],hp:[55,72],kn:[43,90],an:[31,108],to:[38,110],el:[87,51],wr:[95,60],table:1}),
           F({hd:[93,45],sh:[83,54],hp:[59,78],kn:[45,93],an:[31,108],to:[38,110],el:[82,67],wr:[95,60],table:1})],
 press:[F({el:[67,42],wr:[65,30],kb:1,kbo:[3,-3]}),F({el:[62,10],wr:[61,-4],kb:1,kbo:[3,-3]})],

 march:[F({kn:[76,68],an:[72,91],to:[80,93],kn2:[61,85],an2:[60,108],to2:[68,110],el:[52,43],wr:[49,56],el2:[67,41],wr2:[74,32]}),
        F({kn2:[76,68],an2:[72,91],to2:[80,93],el2:[52,43],wr2:[49,56],el:[67,41],wr:[74,32]})],

        F({hd:[59,32],sh:[59,47],hp:[58,78],kn:[76,82],an:[75,108],kn2:[47,103],an2:[32,103],to2:[27,110],el:[54,63],wr:[60,77]})],

         F({hd:[13,103],sh:[26,102],hp:[59,82],kn:[79,79],an:[85,106],to:[93,108],el:[38,108],wr:[50,108],lie:1})],
 hinge:[F({el:[72,24],wr:[61,17]}),F({hd:[91,43],sh:[80,47],hp:[48,61],kn:[57,85],el:[94,52],wr:[88,42]})],
 halo:[F({el:[72,22],wr:[73,8],el2:[71,23],wr2:[72,9],kb:1,kbo:[2,-4]}),F({el:[49,22],wr:[47,8],el2:[50,23],wr2:[48,9],kb:1,kbo:[-2,-4]})],
 jack:[F({front:1,hd:[60,14],sh:[60,29],hp:[60,61],kn:[56,85],an:[55,108],kn2:[64,85],an2:[65,108],el:[50,44],wr:[48,59],el2:[70,44],wr2:[72,59]}),
       F({front:1,hd:[60,14],sh:[60,29],hp:[60,61],kn:[50,85],an:[42,108],kn2:[64,85],an2:[65,108],el:[47,18],wr:[42,3],el2:[73,18],wr2:[78,3]})],
 stretch:[F({front:1,el:[56,14],wr:[58,-1],el2:[64,14],wr2:[62,-1],kn:[57,85],an:[56,108],kn2:[63,85],an2:[64,108]}),
          F({front:1,hd:[50,16],sh:[54,30],el:[44,15],wr:[36,3],el2:[52,14],wr2:[42,1],kn:[57,85],an:[56,108],kn2:[63,85],an2:[64,108]})],
 wall:[F({front:1,kn:[57,85],an:[56,108],kn2:[63,85],an2:[64,108],el:[44,30],wr:[46,16],el2:[76,30],wr2:[74,16]}),F({front:1,kn:[57,85],an:[56,108],kn2:[63,85],an2:[64,108],el:[50,12],wr:[54,-2],el2:[70,12],wr2:[66,-2]})],
 squeeze:[F({el:[70,40],wr:[84,40]}),F({el:[50,42],wr:[62,40]})],
 rest:[F({}),F({})]
};
const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
function mix(A,B,t){const o={};for(const k in A){o[k]=Array.isArray(A[k])&&Array.isArray(B[k])?lerp(A[k],B[k],t):A[k]}return o}
function full(q){q=Object.assign({},q);['kn','an','el','wr'].forEach(k=>{if(!q[k+'2'])q[k+'2']=q[k]});
 if(!q.to)q.to=q.front?[q.an[0]-4,q.an[1]+2]:[q.an[0]+8,q.an[1]+2];if(!q.to2)q.to2=q.front?[q.an2[0]+4,q.an2[1]+2]:[q.an2[0]+8,q.an2[1]+2];return q}
function bodySvg(k,t){const P=POSE[k]||POSE.rest;let q=full(mix(full(P[0]),full(P[1]),t));
 const L=(a,b,c,w)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
 const SK='#f0c7a2',SKd='#c99a78',SH='#ff7a2f',PA='#3d5a9e',PAd='#2a3d6b',SHO='#e8ebf2';
 let s=`<svg viewBox="0 -14 120 130"><rect x="0" y="110" width="120" height="6" fill="#232838"/>`;
 if(q.chair)s+=`<rect x="86" y="77" width="26" height="5" rx="2" fill="#6b5640"/><line x1="89" y1="82" x2="89" y2="110" stroke="#6b5640" stroke-width="3"/><line x1="109" y1="82" x2="109" y2="110" stroke="#6b5640" stroke-width="3"/><line x1="109" y1="77" x2="109" y2="52" stroke="#6b5640" stroke-width="3"/>`;
 if(q.table)s+=`<rect x="92" y="58" width="28" height="5" rx="2" fill="#6b5640"/><line x1="114" y1="63" x2="114" y2="110" stroke="#6b5640" stroke-width="3"/>`;
 if(q.lie)s+=`<rect x="4" y="108" width="70" height="3" rx="1" fill="#4a3a6b"/>`;
 // дальние конечности
 s+=L(q.hp,q.kn2,PAd,11)+L(q.kn2,q.an2,PAd,9)+L(q.an2,q.to2,'#222',6);
 s+=L(q.sh,q.el2,SKd,8)+L(q.el2,q.wr2,SKd,7);
 // торс + шея
 const nk=lerp(q.sh,q.hd,.45);
 s+=L(q.sh,nk,SK,7)+L(q.sh,q.hp,SH,17)+L(q.hp,lerp(q.hp,q.sh,.12),PA,17);
 // голова: лицо смотрит по направлению торса
 const dx=q.front?0:Math.sign((q.hd[0]-q.hp[0])||1)*3;
 s+=`<circle cx="${q.hd[0]}" cy="${q.hd[1]}" r="8.5" fill="${SK}"/><path d="M${q.hd[0]-8.5} ${q.hd[1]-1} A8.5 8.5 0 0 1 ${q.hd[0]+8.5} ${q.hd[1]-1} L${q.hd[0]+8.5-(dx>0?6:0)} ${q.hd[1]-3} Z" fill="#3a2a1e"/>`;
 if(!q.front)s+=`<circle cx="${q.hd[0]+dx+1.5}" cy="${q.hd[1]}" r="1.3" fill="#1a0d04"/>`;else s+=`<circle cx="${q.hd[0]-3}" cy="${q.hd[1]}" r="1.2" fill="#1a0d04"/><circle cx="${q.hd[0]+3}" cy="${q.hd[1]}" r="1.2" fill="#1a0d04"/>`;
 // ближние конечности
 s+=L(q.hp,q.kn,PA,12)+L(q.kn,q.an,PA,10)+L(q.an,q.to,'#111',6);
 s+=L(q.sh,q.el,SK,9)+L(q.el,q.wr,SK,8)+`<circle cx="${q.wr[0]}" cy="${q.wr[1]}" r="3.6" fill="${SK}"/>`;
 if(q.kb){const o=q.kbo||[0,8],c=[q.wr[0]+o[0],q.wr[1]+o[1]];s+=`<path d="M${c[0]-4.5} ${c[1]-3} Q${c[0]} ${c[1]-12} ${c[0]+4.5} ${c[1]-3}" stroke="#1d2a44" stroke-width="2.6" fill="none"/><circle cx="${c[0]}" cy="${c[1]+2}" r="7" fill="#1d2a44"/><circle cx="${c[0]-2}" cy="${c[1]}" r="2" fill="#4a6ba8"/>`}
 return s+'</svg>'}
// ===== ЛИЦО: бюст с плавной анимацией =====
function faceSvg(k,t){const e=t;let rot=0,tx=0;if(k==='chin')rot=-18*e;if(k==='neck')rot=20*e;if(k==='tuck')tx=-7*e;
 const SK='#f0c7a2';let mouth,eyes,brows='<path d="M37 41 Q43 38 48 41 M52 41 Q57 38 63 41" stroke="#3a2a1e" stroke-width="2.4" fill="none"/>',cheek='',jaw=0,extra='';
 eyes=`<ellipse cx="42.5" cy="48" rx="4" ry="${(2.6-(k==='eyes'?2.1*e:0)).toFixed(2)}" fill="#fff"/><ellipse cx="57.5" cy="48" rx="4" ry="${(2.6-(k==='eyes'?2.1*e:0)).toFixed(2)}" fill="#fff"/><circle cx="43" cy="48" r="${k==='eyes'?1.8-1.2*e:1.8}" fill="#2a1a10"/><circle cx="58" cy="48" r="${k==='eyes'?1.8-1.2*e:1.8}" fill="#2a1a10"/>`;
 mouth=`<path d="M43 70 Q50 72 57 70" stroke="#8a3b2e" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
 if(k==='chin')mouth=`<path d="M45 ${70-2*e} Q50 ${66-4*e} 55 ${70-2*e}" stroke="#8a3b2e" stroke-width="${2.6+2*e}" fill="none" stroke-linecap="round"/>`;
 if(k==='vowel'){const o=e<.5;mouth=o?`<ellipse cx="50" cy="71" rx="${4+2*e}" ry="${3+12*e}" fill="#5a1f18"/>`:`<path d="M${40-4*e} 70 Q50 ${74+2*e} ${60+4*e} 70 Q50 ${72} ${40-4*e} 70" fill="#fff" stroke="#8a3b2e" stroke-width="2"/>`}
 if(k==='smile')mouth=`<path d="M${42-6*e} ${69-3*e} Q50 ${73+8*e} ${58+6*e} ${69-3*e}" stroke="#8a3b2e" stroke-width="2.6" fill="${e>.3?'#fff':'none'}"/>`+(e>.3?`<circle cx="${36-6*e}" cy="${66-3*e}" r="3" fill="${SK}" stroke="#c99a78"/><circle cx="${64+6*e}" cy="${66-3*e}" r="3" fill="${SK}" stroke="#c99a78"/>`:'');
 if(k==='cheek'){const l=e<.5;cheek=`<circle cx="${l?30:70}" cy="64" r="${4+6*Math.sin(e*Math.PI)}" fill="#f5b28a" opacity=".9"/>`;mouth=`<path d="M46 70 Q50 68 54 70" stroke="#8a3b2e" stroke-width="3" fill="none"/>`}

 const chinY=88+(k==='jaw'?2*e:0);
 return `<svg viewBox="0 0 100 116"><path d="M8 116 Q12 98 34 96 L66 96 Q88 98 92 116 Z" fill="#ff7a2f"/>
 <g transform="translate(${tx} 0) rotate(${rot} 50 100)"><rect x="40" y="78" width="20" height="22" fill="#e2b38f"/>
 <path d="M22 54 Q22 18 50 16 Q78 18 78 54 Q78 76 ${62+jaw} ${chinY} Q50 ${96+jaw*.4} ${38} ${chinY} Q22 76 22 54Z" fill="${SK}"/>
 <path d="M22 50 Q20 14 50 12 Q80 14 78 50 Q74 26 50 24 Q28 26 22 50Z" fill="#3a2a1e"/>
 <ellipse cx="21" cy="54" rx="3.5" ry="7" fill="#e2b38f"/><ellipse cx="79" cy="54" rx="3.5" ry="7" fill="#e2b38f"/>
 ${brows}${eyes}<path d="M50 50 L47 62 Q50 64 53 62" stroke="#c99a78" stroke-width="2" fill="none"/>${cheek}${mouth}${extra}</g></svg>`}
const svg=(e,t)=>e?(e.face?faceSvg(e.p,t):bodySvg(e.p,t)):'';


// ================= УПРАЖНЕНИЯ =================
const EX={
 warm:{n:"Разминка",p:"march",t:"Ходьба на месте, круги плечами и тазом. Разогрейся."},
 swing:{n:"Махи гирей",p:"swing",t:"Таз назад, спина прямая, гиря между ног. Резкий толчок тазом, гиря летит до груди силой бёдер, не рук."},
 goblet:{n:"Гоблет-присед",p:"goblet",t:"Гиря у груди. Садись глубоко, колени по линии носков, пятки на полу."},

async function initCloud(){
 try{db=await claude.use("db")}catch(e){db=null}
 try{sample=await claude.use("sample")}catch(e){}
 try{tts=await claude.use("tts")}catch(e){}
 if(!db){render();return}
 try{const c=val(await db.doc('config/main').get());applyCfg(c)}catch(e){}
 try{db.doc('config/main').onSnapshot(s=>{applyCfg(val(s));render()})}catch(e){}
 try{const s=val(await db.doc('state/main').get());if(s)STATE=Object.assign(STATE,s)}catch(e){}
 try{const r=await db.collection('days').get();const arr=Array.isArray(r)?r:(r&&r.docs)||[];

// ===== ДИНАМИЧЕСКОЕ УПРАВЛЕНИЕ: Claude пишет в базу config/main, приложение подхватывает сразу =====
// Поля config/main (все необязательные):
//  cfg:{kcal,protein,water,goal,...}  msg:"текст"  schedule:[[время,текст]]
//  ex:{ключ:{n,p,t,face?,sw?}}  rew:{ключ:[5 наград]}  wrew:{тренировка:[...]}
//  workouts:{ключ:{n,d,rounds,warm,list:[[ex,work,rest]]}}  dayw:{1:'A',3:'B',5:'C'}  xpv:{ключ:xp}
//  care:{am|pm:{n,t,steps:[[название,пояснение]],rew:[...]}}
//  remove:{ex:[..],workouts:[..]}   cards:[{date?,dow?,emoji,title,text,task?:{label,action}}]
//  tips:[строки]  missions:[{label,rew,dow?}]  — свои миссии (отмечаются нажатием)
let CARDS=[],XM=[],TIPS=null;
function applyCfg(c){if(!c)return;
 ['start','goal','kcal','protein','water','glass','msg','schedule'].forEach(k=>{if(c[k]!==undefined)CFG[k]=c[k]});if(c.cfg)Object.assign(CFG,c.cfg);
 if(c.ex)Object.assign(EX,c.ex);if(c.rew)Object.assign(REW,c.rew);if(c.wrew)Object.assign(WREW,c.wrew);
 if(c.workouts)Object.assign(W,c.workouts);if(c.dayw){Object.keys(DAYW).forEach(k=>delete DAYW[k]);Object.assign(DAYW,c.dayw)}
 if(c.xpv)Object.assign(XPV,c.xpv);if(c.care)Object.keys(c.care).forEach(k=>CARE[k]=Object.assign(CARE[k]||{},c.care[k]));
 if(c.remove){(c.remove.workouts||[]).forEach(k=>delete W[k]);(c.remove.ex||[]).forEach(k=>delete EX[k])}
 Object.keys(W).forEach(k=>W[k].list=W[k].list.filter(x=>EX[x[0]]));
 CARDS=c.cards||[];XM=c.missions||[];if(c.reminders)REM=c.reminders;if(c.melodies)Object.assign(MEL,c.melodies);TIPS=c.tips||null;}
function todayCards(){const k=todayKey(),dw=new Date().getDay();return CARDS.filter(c=>(!c.date||c.date===k)&&(c.dow==null||[].concat(c.dow).includes(dw)))}
function cardsHtml(){const cs=todayCards();if(!cs.length)return'';const seen=(day().seen||[]),open=window.__open||{};
 return cs.map((c,i)=>i>0&&!open[i]?`<div class="card coach" onclick="(window.__open=window.__open||{})[${i}]=1;render()"><div class="row"><b>${c.emoji||'📌'} ${esc(c.title||'')}</b><span class="mut" style="flex:none">открыть ▾</span></div></div>`:`<div class="card coach"><h2>${c.emoji||'📌'} ${esc(c.title||'')}</h2><div style="line-height:1.45">${esc(c.text||'').replace(/\n/g,'<br>')}</div>${c.task?`<button onclick="${/^[\w'(),]+$/.test(c.task.action||'')?c.task.action:'go(\'home\')'};markCard('${esc(c.title)}')">${esc(c.task.label)}</button>`:''}</div>`).join('')}
function markCard(t){const d=day();d.seen=d.seen||[];if(!d.seen.includes(t)){d.seen.push(t);saveDay()}}
function xmTick(i){const d=day();d.xm=d.xm||{};d.xm[i]=!d.xm[i];saveDay();render()}
function dayActive(d){return d&&((d.done||[]).length||d.water>=1000||(d.foods||[]).length)}
// Мягкая серия: один пропущенный день подряд серию не обнуляет («не пропускай два дня подряд»)
function streak(){let n=0,miss=0;const d=new Date();if(!dayActive(DAYS[todayKey()]))d.setDate(d.getDate()-1);
 for(let i=0;i<2000;i++){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(dayActive(DAYS[k])){n++;miss=0}else{miss++;if(miss>1||!Object.keys(DAYS).some(x=>x<k))break}d.setDate(d.getDate()-1)}return n}
function missedYesterday(){const d=new Date();d.setDate(d.getDate()-1);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return Object.keys(DAYS).some(x=>x<k)&&!dayActive(DAYS[k])&&!dayActive(DAYS[todayKey()])}
function totalXP(){let x=0;Object.values(DAYS).forEach(d=>{(d.done||[]).forEach(w=>x+=XPV[w.k]||10);x+=Math.floor((d.water||0)/CFG.glass)*2;x+=(d.foods||[]).length*3;['am','pm'].forEach(w=>{const c=(d.care||{})[w]||[];if(CARE[w].steps.every((_,j)=>c[j]))x+=5});if(d.weight)x+=10;});return x}
const RANKS=["Новичок","Ученик","Боец","Воин","Атлет","Машина","Легенда"];
function lvl(){const x=totalXP();const L=Math.floor(Math.sqrt(x/50));return{L,x,cur:50*L*L,next:50*(L+1)*(L+1),rank:RANKS[Math.min(RANKS.length-1,Math.floor(L/3))]}}
function weights(){return Object.keys(DAYS).sort().filter(k=>DAYS[k].weight).map(k=>[k,DAYS[k].weight])}
function curW(){const w=weights();return w.length?w[w.length-1][1]:CFG.start}
function countDone(k){let n=0;Object.values(DAYS).forEach(d=>(d.done||[]).forEach(w=>{if(!k||k.includes(w.k))n++}));return n}
function BADGES(){const lost=CFG.start-curW(),s=streak();return[
 ["🔥","3 дня подряд",s>=3],["⚡","7 дней подряд",s>=7],["👑","30 дней подряд",s>=30],
 ["💪","1-я тренировка",countDone(['A','B','C'])>=1],["🏋️","10 тренировок",countDone(['A','B','C'])>=10],["🦾","50 тренировок",countDone(['A','B','C'])>=50],
 ["📉","−1 кг",lost>=1],["🎯","−5 кг",lost>=5],["🚀","−10 кг",lost>=10],["🏆","−20 кг",lost>=20],["🥇","Цель 90 кг",curW()<=CFG.goal],
 ["😎","10× лицо",countDone(['face'])>=10],["💧","Норма воды ×7",Object.values(DAYS).filter(d=>d.water>=CFG.water).length>=7],["🪑","50 перерывов",countDone(['desk'])>=50]]}
function missions(){const d=day(),dow=new Date().getDay(),m=[];
 const has=k=>(d.done||[]).some(w=>w.k===k);
 if(DAYW[dow])m.push([`Тренировка ${W[DAYW[dow]].n}`,has(DAYW[dow]),`start('${DAYW[dow]}')`,WREW[DAYW[dow]][0]+' · +60 XP']);
 if(dow>=1&&dow<=5)m.push([`Перерывы у стола: ${(d.done||[]).filter(w=>w.k==='desk').length}/6`,(d.done||[]).filter(w=>w.k==='desk').length>=6,"start('desk')",MREW.desk]);
 m.unshift(["Уход утром",careDone('am'),"careView('am')",CARE.am.rew[0]]);m.push(["Уход вечером",careDone('pm'),"careView('pm')",CARE.pm.rew[0]]);
 m.push([`Вода: ${d.water}/${CFG.water} мл`,d.water>=CFG.water,"addWater()",MREW.water]);
 const p=(d.foods||[]).reduce((a,f)=>a+(+f.p||0),0);if(!isFast())m.push([`Белок: ${Math.round(p)}/${CFG.protein} г`,p>=CFG.protein,"go('food')",MREW.protein]);
 if(!isFast())m.push(["Вечер 15 мин",has('eve'),"start('eve')",WREW.eve[0]]);m.push(["Осанка 5 мин",has('posture'),"start('posture')",WREW.posture[0]]);m.push(["Лицо и шея",has('face'),"start('face')",WREW.face[0]]);
 if(dow===1||dow===4)m.push(["Взвешивание",!!d.weight,"go('prog')",MREW.weight]);
 XM.forEach((x,i)=>{if(x.dow==null||[].concat(x.dow).includes(dow))m.push([esc(x.label),!!(d.xm||{})[i],`xmTick(${i})`,esc(x.rew||'')])});return m}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)}

function remOn(r,d=new Date()){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return(!r.dow||r.dow.includes(d.getDay()))&&(!r.from||k>=r.from)&&(!r.until||k<=r.until)}
const MEL={ // [частота, длительность мс] — разные мелодии
 water:[[660,140],[880,140],[1175,260]],
 meal:[[523,200],[659,200],[784,200],[659,300]],
 move:[[784,120],[784,120],[988,240]],
 train:[[523,120],[659,120],[784,120],[1047,180],[784,120],[1047,400]],
 care:[[1319,350],[988,350],[1319,500]],
 weigh:[[440,200],[554,200],[659,400]],

 alarm:[[880,180],[0,80],[880,180],[0,80],[880,180],[0,300],[880,180],[0,80],[880,180],[0,80],[880,300]]

const REMICON={water:"💧",meal:"🍽",move:"🪑",train:"💪",care:"✨",weigh:"⚖️",face:"😎",alarm:"⏰"};
function melody(type,vol=.25){try{const a=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());a.resume&&a.resume();let t=a.currentTime+.05;
 (MEL[type]||MEL.water).forEach(([f,ms])=>{if(f){const o=a.createOscillator(),g=a.createGain();o.type=type==='alarm'?'square':'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+ms/1000);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+ms/1000+.05)}t+=ms/1000+.03})}catch(e){}}
let REMON=false,REMFIRED={},SNOOZE=[];
function remToggle(){REMON=!REMON;try{localStorage.setItem('remon',REMON?'1':'')}catch(e){}if(REMON){melody('water');try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>window._wl=l).catch(()=>{})}catch(e){}toast('🔔 Напоминания включены')}render()}
function remTick(){if(!REMON||IS_APP)return;const d=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),dw=d.getDay(),key=todayKey();
 REM.forEach((r,i)=>{const id=key+i;if(r.t===hm&&remOn(r)&&!REMFIRED[id]){REMFIRED[id]=1;fire(r)}});
 SNOOZE=SNOOZE.filter(s=>{if(Date.now()>=s.at){fire(s.r);return false}return true})}
function fire(r){melody(r.type);const b=$('rembox');
 b.innerHTML=`<div class="card coach" style="margin:0"><div class="big">${REMICON[r.type]||'🔔'} ${r.t||''}</div><div style="font-size:19px;margin:6px 0">${esc(r.text)}</div>${REW&&r.type==='water'?`<div class="mut">${MREW.water}</div>`:''}
 <div class="row"><button onclick="remDo(${REM.indexOf(r)})">${r.act?'Сделать':'Готово'}</button><button class="sec" onclick="remLater(${REM.indexOf(r)})">Через 10 мин</button></div></div>`;b.style.display='block'}
function remDo(i){$('rembox').style.display='none';const r=REM[i];if(r&&r.type==='water'&&!/addWater/.test(r.act||''))addWater();if(r&&r.act){try{(new Function(r.act))()}catch(e){}}}
function remLater(i){$('rembox').style.display='none';SNOOZE.push({at:Date.now()+600000,r:REM[i]})}
function nextRem(){const d=new Date(),dw=d.getDay(),now=d.getHours()*60+d.getMinutes();return REM.filter(r=>remOn(r)).map(r=>{const[h,m]=r.t.split(':').map(Number);return[h*60+m,r]}).filter(x=>x[0]>now).sort((a,b)=>a[0]-b[0])[0]}
setInterval(remTick,15000);

 <div class="card"><h2>⚖️ Вес</h2><div class="row"><input id="w" type="number" step="0.1" inputmode="decimal" placeholder="кг натощак"><button style="flex:none;width:auto;margin:0" onclick="addW()">Записать</button></div>${chart}
 <table>${ws.slice(-8).reverse().map(x=>`<tr><td class="mut">${x[0]}</td><td style="text-align:right"><b>${x[1]} кг</b></td></tr>`).join('')||`<tr><td class="mut">Старт</td><td style="text-align:right"><b>${CFG.start} кг</b></td></tr>`}</table></div>
 <div class="card"><h2>📸 Фото «было / стало»</h2><div class="mut">Раз в неделю: анфас и профиль, при одном свете и с одного места. Вес — это цифра, фото — то, что видят люди.</div>
 ${IS_APP?`<input type="file" accept="image/*" id="ph" style="display:none" onchange="addPhoto(this)"><button class="sec" onclick="$('ph').click()">➕ Добавить фото</button>${photoCompare()}`:'<div class="mut">Доступно в приложении для Android.</div>'}</div>
 <div class="card"><h2>📏 Замеры</h2><div class="row"><input id="mw" type="number" inputmode="decimal" placeholder="талия, см"><input id="mn" type="number" inputmode="decimal" placeholder="шея, см"><button style="flex:none;width:auto;margin:0" onclick="addMeas()">OK</button></div>
 <table>${Object.keys(DAYS).sort().filter(k=>DAYS[k].meas).slice(-5).reverse().map(k=>`<tr><td class="mut">${k}</td><td style="text-align:right">талия <b>${DAYS[k].meas.w||'—'}</b> · шея <b>${DAYS[k].meas.n||'—'}</b></td></tr>`).join('')}</table></div>
 ${craveStats()}
 <div class="card"><h2>🏅 Достижения ${b.filter(x=>x[2]).length}/${b.length}</h2>${b.map(x=>`<div class="badge ${x[2]?'got':''}"><b>${x[0]}</b>${x[1]}</div>`).join('')}</div>
 <div class="card"><h2>📊 Итого</h2><div class="pill">Тренировок: ${countDone(['A','B','C'])}</div><div class="pill">Перерывов: ${countDone(['desk'])}</div><div class="pill">Лицо: ${countDone(['face'])}</div><div class="pill">Уровень ${l.L} · ${l.x} XP</div><div class="pill">Лучшая серия: ${streak()} дн</div></div>
 ${IS_APP?`<div class="card"><h2>📤 Отчёт для Claude</h2><div class="mut">Отправь в чат Claude — я разберу неделю и поправлю программу.</div><button onclick="report()">Отправить отчёт</button><button class="sec" onclick="Android.checkUpdate()">Проверить обновления · версия 1.${Android.version()}</button></div>`:''}<div class="card"><h2>❤️ Моё «зачем»</h2><div class="mut">Ради чего ты это делаешь? Это будет на главном экране.</div><textarea id="why" rows="2">${esc(STATE.why||'')}</textarea><button class="sec" onclick="STATE.why=$('why').value;saveState();toast('Сохранено')">Сохранить</button></div>`}
function remCard(){const n=nextRem();if(IS_APP)return `${window.__upd?`<div class="card today"><h2>🚀 Доступна версия ${window.__upd}</h2><button onclick="Android.checkUpdate()">Обновить</button></div>`:''}<div class="card"><h2 style="margin:0">🔔 Напоминания включены</h2><div class="mut">Системные, со своими мелодиями — работают даже при закрытом приложении. ${n?`Следующее в ${n[1].t}: ${REMICON[n[1].type]} ${esc(n[1].text)}`:''}</div><details style="margin-top:8px"><summary class="mut">Послушать звуки</summary>${Object.keys(MEL).map(k=>`<button class="sec sm" onclick="melody('${k}')">${REMICON[k]} ${k}</button>`).join('')}</details></div>`;return `<div class="card"><div class="row"><div><h2 style="margin:0">🔔 Напоминания со звуком</h2><div class="mut">${REMON?(n?`Следующее в ${n[1].t}: ${REMICON[n[1].type]} ${esc(n[1].text)}`:'На сегодня всё'):'Работают, пока приложение открыто'}</div></div><button style="flex:none;width:auto;margin:0" class="${REMON?'sec':''}" onclick="remToggle()">${REMON?'Выкл':'Вкл'}</button></div>
 <details style="margin-top:8px"><summary class="mut">Послушать звуки</summary>${Object.keys(MEL).map(k=>`<button class="sec sm" onclick="melody('${k}')">${REMICON[k]} ${{water:'вода',meal:'еда',move:'перерыв',train:'тренировка',care:'уход',weigh:'вес',face:'лицо',alarm:'будильник'}[k]}</button>`).join('')}</details></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mini(){const m=missions(),dn=m.filter(x=>x[1]).length,n=nextRem(),d=day();
 return `<div class="row"><h1>✅ Сегодня ${dn}/${m.length}</h1><div style="flex:none" class="big">🔥${streak()}</div></div>
 ${n?`<div class="mut" style="margin-bottom:8px">Следующее: ${n[1].t} ${REMICON[n[1].type]} ${esc(n[1].text)}</div>`:''}
 <div class="card">${m.map(x=>`<div class="mission ${x[1]?'done':''}" onclick="${x[2]}" style="padding:13px 0;font-size:17px"><div class="chk" style="width:30px;height:30px">${x[1]?'✓':''}</div><span>${x[0]}</span></div>`).join('')}<div id="careout"></div></div>
 <div class="row"><button onclick="addWater()">💧 +стакан (${d.water})</button><button class="sec" onclick="start('desk')">🪑 Перерыв</button></div>
 ${todayCards().map(c=>`<div class="card coach" style="margin-top:12px"><b>${c.emoji||'📌'} ${esc(c.title||'')}</b><div class="mut" style="margin-top:4px">${esc(c.text||'').replace(/\n/g,'<br>')}</div></div>`).join('')}
 <button class="sec" onclick="location.hash='';go('home')">Открыть всё приложение</button>`}
function render(){pushNative();if($('player').style.display==='block')return;const isMini=location.hash==='#today';$('app').innerHTML=isMini?mini():{home,train,food,prog}[TAB]();$('nav').style.display=isMini?'none':'flex';if(!isMini)nav()}
addEventListener('hashchange',render);setInterval(()=>{if(IS_APP)pushNative()},60000);

// ================= ДЕЙСТВИЯ =================
function addWater(n=1){const d=day();d.water=Math.max(0,d.water+n*CFG.glass);saveDay();if(n>0)toast(d.water>=CFG.water?'💧 Норма воды выполнена! +2 XP':'💧 +2 XP');render()}
function addW(){const v=parseFloat($('w').value);if(!v)return;const prev=curW();day().weight=v;saveDay();toast(v<prev?`📉 −${(prev-v).toFixed(1)} кг! Так держать`:'Записано. Важен тренд, не один день');render()}
function delFood(i){day().foods.splice(i,1);saveDay();render()}
function quickFood(f){day().foods.push(f);saveDay();toast('+ '+f.name);render()}
function addFoodManual(){const k=+$('fk').value,p=+$('fp').value;if(!k)return;day().foods.push({name:($('fname')&&$('fname').value)||$('fin').value||'Еда',g:0,kcal:k,p:p||0});saveDay();render()}
async function addFood(){const t=$('fin').value.trim();if(!t)return;const b=$('fbtn');b.disabled=true;b.textContent='Считаю…';
 try{const r=await sample.json(`Ты нутрициолог. Пользователь-вегетарианец (без мяса) взвесил еду. Разбери текст на продукты и посчитай по стандартным таблицам (крупы — сухой вес, если не сказано иное). Текст: «${t}». Верни только JSON: {"items":[{"name":"короткое название по-русски","g":число_грамм_или_мл,"kcal":число,"p":белок_г}]}`,{modelTier:'quick'});
  const items=(r&&r.items)||[];items.forEach(i=>day().foods.push({name:String(i.name),g:+i.g||0,kcal:+i.kcal||0,p:+i.p||0}));saveDay();toast(`+${Math.round(items.reduce((a,i)=>a+(+i.kcal||0),0))} ккал`);render();}
 catch(e){b.disabled=false;b.textContent='Не вышло, попробуй ещё';}}
async function sos(){const o=$('sosout');o.textContent='…';const d=day();
 try{await sample(`Ты — тёплый, но прямой тренер Claude. Мужчина 37 лет, Украина (война, мало возможностей), худеет с ${CFG.start} до ${CFG.goal} кг, сейчас ${curW()} кг, серия ${streak()} дней, уровень ${lvl().L}. Его «зачем»: «${STATE.why||'не указано'}». Сегодня: вода ${d.water} мл, тренировок ${(d.done||[]).length}. Ему сейчас тяжело и хочется всё бросить. Ответь по-русски 4–6 предложениями: признай чувство, напомни прогресс и зачем, предложи ОДНО маленькое действие на ближайшие 5 минут. Без морали и без медицинских советов.`,{onText:({text})=>o.textContent=text});}
 catch(e){o.textContent='Сделай сейчас одно: стакан воды и 3-минутный перерыв. Маленький шаг тоже шаг. Я в тебя верю.'}}

// ================= ДВИЖОК ТРЕНИРОВКИ =================
function build(key,light){const w=W[key],s=[],lv=key==='desk'||key==='face'?0:(STATE.level||0);const r=Math.max(1,(light?w.rounds-1:w.rounds)+(lv>=4?1:0));
 if(w.warm)s.push({k:'warm',d:w.warm,ph:'work'});
 for(let i=1;i<=r;i++)w.list.forEach(([k,d,rst],j)=>{s.push({k,d:Math.max(15,d+3*lv),ph:'work',info:r>1?(w.list.length===1?`Подход ${i}/${r}`:`Круг ${i}/${r}`):''});if(rst&&!(i===r&&j===w.list.length-1))s.push({k:'rest',d:Math.max(10,rst-2*lv),ph:'rest'});});
 if(w.warm)s.push({k:'cool',d:180,ph:'work'});return s}
function startOne(k){const n=Math.max(1,+$('xs').value||3),w=Math.max(10,+$('xw').value||40),r=Math.max(5,+$('xr').value||30);
 W._one={n:EX[k].n,d:'',rounds:n,warm:0,list:[[k,w,r]]};XPV._one=Math.min(30,5*n);start('_one')}
function mins(k){return Math.round(build(k).reduce((a,b)=>a+b.d,0)/60)}
let steps=[],idx=0,left=0,timer=null,paused=false,cur=null,curKey=null;
function say(t){if(tts){tts.speak(t,{language:'ru'}).catch(()=>sayLocal(t));return}sayLocal(t)}
function sayLocal(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';speechSynthesis.speak(u)}catch(e){}}
function beep(f=880,ms=150){try{const a=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=.2;o.start();o.stop(a.currentTime+ms/1000)}catch(e){}}
const label=st=>st.k==='rest'?'Отдых':EX[st.k].n;
function start(k,light){curKey=k;steps=build(k,light);idx=-1;$('app').style.display='none';$('nav').style.display='none';$('player').style.display='block';$('fbk').innerHTML='';$('pctl').style.display='flex';scrollTo(0,0);try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}beep();show({k:'rest',d:8,ph:'rest',ready:1})}
function show(st){cur=st;left=st.d;paused=false;$('pb').textContent='Пауза';const nx=steps[idx+1];
 $('phase').textContent=st.ready?'Готовься':(st.ph==='rest'?'Отдых':'Работа');$('phase').style.color=st.ph==='rest'?'var(--rest)':'var(--ok)';
 const e=EX[st.ph==='rest'&&nx?nx.k:st.k];
 $('ex').textContent=st.ph==='rest'?(nx?'Дальше: '+label(nx):''):label(st);
 $('info').textContent=[st.info,st.ph==='work'?st.d+' сек':'',`${Math.min(steps.length,idx+2)}/${steps.length}`].filter(Boolean).join(' · ');
 $('fig').innerHTML=e?svg(e,0):'';const ek=st.ph==='rest'&&nx?nx.k:st.k;$('cue').innerHTML=(e?esc(e.t):'')+(st.ph==='rest'||st.ready?rewList(REW[ek]):(REW[ek]?`<div style="margin-top:8px;color:var(--acc2)">${REW[ek][(idx>0?idx:0)%5]}</div>`:''));
 if(st.ready)say('Поехали! Первое: '+label(nx));else if(st.ph==='rest')say('Отдых. Дальше '+(nx?label(nx):'')+'. '+(REW[ek]?REW[ek][idx%5].replace(/[^\p{L}\p{N}\s.,:+–−%-]/gu,''):''));else say(label(st)+'. '+e.t);
 tick();clearInterval(timer);timer=setInterval(()=>{if(paused)return;left--;if(left<=3&&left>0)beep(660,90);if(EX[cur.k]&&EX[cur.k].sw&&left===Math.floor(cur.d/2))say('Смени сторону');tick();if(left<=0)nextStep()},1000)}
function tick(){$('time').textContent=left>=60?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):left;$('pbar').style.width=(100*(1-left/cur.d))+'%'}
function nextStep(){beep(990,250);idx++;if(idx>=steps.length){finish();return}show(steps[idx])}
function togglePause(){paused=!paused;$('pb').textContent=paused?'Продолжить':'Пауза'}
function finish(){clearInterval(timer);cur=null;const xp=XPV[curKey]||10;day().done.push({k:curKey,t:new Date().toTimeString().slice(0,5)});saveDay();
 say('Готово! Отличная работа. Плюс '+xp+' очков.');$('phase').textContent='Готово';$('ex').textContent='🎉 +'+xp+' XP';$('fig').innerHTML='';$('time').textContent='✓';$('info').textContent='Серия: 🔥 '+streak()+' дн';$('cue').textContent='Выпей воды. Как было?';$('pctl').style.display='none';
 $('fbk').innerHTML=['A','B','C','eve'].includes(curKey)?`<div class="row"><button class="sec" onclick="fb(1)">😎 Легко</button><button class="sec" onclick="fb(0)">👍 Норм</button><button class="sec" onclick="fb(-1)">🥵 Тяжело</button></div>`:''}
function fb(v){const d=day();d.done[d.done.length-1].fb=v;saveDay();STATE.level=Math.max(-3,Math.min(10,(STATE.level||0)+v));saveState();toast(v>0?'Следующая будет чуть сложнее 💪':v<0?'Чуть облегчу следующую':'Оставляю как есть');stop()}
function stop(){clearInterval(timer);cur=null;try{speechSynthesis.cancel();tts&&tts.stop()}catch(e){}$('player').style.display='none';$('app').style.display='block';$('nav').style.display='flex';render()}
let T0=performance.now();setInterval(()=>{const t=(1-Math.cos((performance.now()-T0)/2400*2*Math.PI))/2;document.querySelectorAll('.anim').forEach(e=>e.innerHTML=svg(EX[e.dataset.k],t));const ei=$('exfig');if(ei)ei.innerHTML=svg(EX[ei.dataset.k],t);if(cur&&cur.ph==='work'&&!paused)$('fig').innerHTML=svg(EX[cur.k],t)},60);

lsLoad();try{REMON=!!localStorage.getItem('remon')}catch(e){}render();initCloud();
</script>
</body>
</html>
